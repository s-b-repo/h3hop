# Stage E — DPO on (prompt, chosen=good, rejected=bad). First weight-level "learn what's bad."
output_dir: artifacts/adapters/dpo
beta: 0.1
learning_rate: 5.0e-6
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
max_length: 2048
max_prompt_length: 1024
loss_type: sigmoid            # sigmoid (vanilla DPO) | ipo | kto_pair
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
seed: 17
report_to: none
# ref_model defaults to the frozen Stage-D adapter merged base.
